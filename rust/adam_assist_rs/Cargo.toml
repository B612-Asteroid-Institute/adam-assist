[package]
name = "adam_assist"
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0"
description = "Pure-Rust ASSIST propagation and ephemeris backend for adam-core"
repository = "https://github.com/B612-Asteroid-Institute/adam-assist"
homepage = "https://github.com/B612-Asteroid-Institute/adam-assist"
documentation = "https://docs.rs/adam_assist"
readme = "README.md"
keywords = ["astronomy", "asteroids", "orbits", "ephemeris", "propagation"]
categories = ["science", "simulation"]

[features]
default = ["kernel-data"]
kernel-data = ["dep:adam_core_rs_kernel_data", "dep:sha2"]
python = ["dep:ndarray", "dep:numpy", "dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
# Active Light-Time Beam/BVH integration pin. Keep every adam-core crate on
# the same exact commit while the upstream assessment PR evolves.
adam_core_rs_coords = { git = "https://github.com/B612-Asteroid-Institute/adam_core.git", rev = "2c01aa91ea5b90f9ae9b1c226e7a88cf935a86f3" }
adam_core_rs_spice = { git = "https://github.com/B612-Asteroid-Institute/adam_core.git", rev = "2c01aa91ea5b90f9ae9b1c226e7a88cf935a86f3" }
adam_core_rs_kernel_data = { git = "https://github.com/B612-Asteroid-Institute/adam_core.git", rev = "2c01aa91ea5b90f9ae9b1c226e7a88cf935a86f3", default-features = false, optional = true }
# Canonical ASSIST/REBOUND FFI and RAII layers. All domain orchestration lives
# in this crate; exact versions are the reviewed mainline sys-crate releases.
libassist-sys = "=1.2.1"
librebound-sys = "=4.6.0"
thiserror = "2"
ndarray = { version = "0.16", optional = true }
numpy = { version = "0.22", optional = true }
pyo3 = { version = "0.22", optional = true }
rayon = "1.11"
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
adam_core_rs_kernel_data = { git = "https://github.com/B612-Asteroid-Institute/adam_core.git", rev = "2c01aa91ea5b90f9ae9b1c226e7a88cf935a86f3", default-features = false }
serde_json = "1"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# Keep this standalone package from being implicitly adopted by an ancestor
# Cargo workspace when adam-assist is checked out beneath another repository
# (as in adam-core's release-candidate wheel matrix).
[workspace]
resolver = "2"
