name: CI

on:
  push:
    branches: [ main, "v*" ]
  pull_request:
    branches: [ main, "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ADAM_CORE_VERSION: "0.7.0"
  ADAM_CORE_SOURCE_REF: "a6478f2f280c266d7a5d1442997eb520fc20888f"
  ADAM_CORE_PYTHON314_REF: "cd4b24f923d048e8538af88dd8c24b1c10b5e770"

jobs:
  source-pair:
    name: Exact public Core release / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout adam-assist
        uses: actions/checkout@v4
      - name: Checkout exact public adam-core release
        uses: actions/checkout@v4
        with:
          repository: B612-Asteroid-Institute/adam_core
          ref: ${{ env.ADAM_CORE_SOURCE_REF }}
          path: .source-pair/adam-core
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - name: Verify source-pair contract
        run: |
          test "$(git -C .source-pair/adam-core rev-parse HEAD)" = "$ADAM_CORE_SOURCE_REF"
          python migration/scripts/verify_source_pair_contract.py \
            --core-tree .source-pair/adam-core
      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.7,<2"
      - name: Build Core and ASSIST wheels from the exact pair
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/source-pair-wheels"
          mkdir -p "$wheelhouse"
          (cd .source-pair/adam-core && maturin build --release --out "$wheelhouse")
          maturin build --release --locked --out "$wheelhouse"
          core_wheel="$(find "$wheelhouse" -name 'adam_core-*.whl' -print -quit)"
          assist_wheel="$(find "$wheelhouse" -name 'adam_assist-*.whl' -print -quit)"
          test -n "$core_wheel" && test -n "$assist_wheel"
          python -m pip install "$core_wheel" "${assist_wheel}[dev]"
          python migration/scripts/verify_dev_environment.py --require-wheel
      - name: Verify release-ready workflow policy
        run: python migration/scripts/verify_workflow_policy.py
      - name: Verify installed versions and wheel dependency floor
        run: |
          python - <<'PY'
          from importlib import metadata
          from packaging.requirements import Requirement

          assert metadata.version("adam-core") == "0.7.0"
          assert metadata.version("adam-assist") == "0.6.0"
          requirements = {
              Requirement(value).name: Requirement(value)
              for value in metadata.requires("adam-assist") or []
          }
          core = requirements["adam-core"]
          assert str(core.specifier) == "<0.8.0,>=0.7.0"
          assert "0.7.0" in core.specifier
          assert "0.8.0" not in core.specifier
          PY
      - name: Run non-live wheel tests
        if: matrix.python-version != '3.12'
        run: python -m pytest --benchmark-skip -q tests
      - name: Run non-live wheel tests with coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest --benchmark-skip --cov=adam_assist --cov-report=xml -q tests
      - name: Lint and typecheck the source
        if: matrix.python-version == '3.12'
        run: |
          ruff check src/adam_assist tests
          black --check src/adam_assist tests
          isort --check-only src/adam_assist tests
          mypy --strict src/adam_assist
      - name: Verify authentic locks and clean tracked state
        run: |
          pdm lock --check
          python migration/scripts/verify_registry_locks.py \
            --core-version "$ADAM_CORE_VERSION" --python-lock --rust-lock
          git diff --exit-code
      - name: Upload exact source-pair wheels
        uses: actions/upload-artifact@v4
        with:
          name: source-pair-wheels-${{ matrix.python-version }}
          path: ${{ runner.temp }}/source-pair-wheels/*.whl
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Coverage report to coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2.0.0
        with:
          path-to-lcov: coverage.xml

  python-314-source-pair:
    name: Exact CPython 3.14 candidate pair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adam-assist
        uses: actions/checkout@v4
      - name: Checkout exact CPython 3.14 adam-core candidate
        uses: actions/checkout@v4
        with:
          repository: B612-Asteroid-Institute/adam_core
          ref: ${{ env.ADAM_CORE_PYTHON314_REF }}
          path: .python314-pair/adam-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - name: Verify exact CPython 3.14 candidate identities
        run: |
          set -euo pipefail
          core=.python314-pair/adam-core
          test "$(git -C "$core" rev-parse HEAD)" = "$ADAM_CORE_PYTHON314_REF"
          python - <<'PY'
          import tomllib
          from pathlib import Path

          core = Path(".python314-pair/adam-core")
          with (core / "pyproject.toml").open("rb") as stream:
              core_python = tomllib.load(stream)
          with (core / "rust/adam_core_py/Cargo.toml").open("rb") as stream:
              core_rust = tomllib.load(stream)
          with Path("pyproject.toml").open("rb") as stream:
              assist_python = tomllib.load(stream)
          with Path("rust/adam_assist_rs/Cargo.toml").open("rb") as stream:
              assist_rust = tomllib.load(stream)
          assert core_python["project"]["requires-python"] == ">=3.11,<3.15"
          assert assist_python["project"]["requires-python"] == ">=3.11,<3.15"
          assert core_rust["dependencies"]["pyo3"]["version"] == "0.28"
          assert core_rust["dependencies"]["numpy"] == "0.28"
          assert assist_rust["dependencies"]["pyo3"]["version"] == "0.28"
          assert assist_rust["dependencies"]["numpy"]["version"] == "0.28"
          PY
      - name: Install CPython 3.14 build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.7,<2"
      - name: Verify exact direct Rust source pair
        shell: bash
        run: |
          set -euo pipefail
          core="$GITHUB_WORKSPACE/.python314-pair/adam-core"
          pair="$RUNNER_TEMP/adam-assist-direct-rust-pair"
          python migration/scripts/verify_python314_pair_lock.py
          cp -R rust/adam_assist_rs "$pair"
          cp migration/locks/adam-assist-core-cd4b24f9.Cargo.lock \
            "$pair/Cargo.lock"
          mkdir -p "$pair/.cargo"
          cat > "$pair/.cargo/config.toml" <<EOF
          [patch.crates-io]
          adam_core = { path = "$core/rust/adam_core" }
          adam_core_rs_autodiff = { path = "$core/rust/adam_core_rs_autodiff" }
          adam_core_rs_coords = { path = "$core/rust/adam_core_rs_coords" }
          adam_core_rs_kernel_data = { path = "$core/rust/adam_core_rs_kernel_data" }
          adam_core_rs_orbit_determination = { path = "$core/rust/adam_core_rs_orbit_determination" }
          adam_core_rs_spice = { path = "$core/rust/adam_core_rs_spice" }
          EOF
          (
            cd "$pair"
            cargo test --locked --all-targets
            cargo run --locked --example core_owned_od
          )
          git diff --exit-code
          git -C "$core" diff --exit-code
      - name: Build and install exact CPython 3.14 wheel pair
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/python314-source-built-pair-wheels"
          mkdir -p "$wheelhouse"
          (cd .python314-pair/adam-core && \
            maturin build --release --locked --out "$wheelhouse")
          maturin build --release --locked --out "$wheelhouse"
          core_wheel="$(find "$wheelhouse" -name 'adam_core-*.whl' -print -quit)"
          assist_wheel="$(find "$wheelhouse" -name 'adam_assist-*.whl' -print -quit)"
          test -n "$core_wheel" && test -n "$assist_wheel"
          python -m pip install "$core_wheel" "${assist_wheel}[dev]"
          python migration/scripts/verify_dev_environment.py --require-wheel
      - name: Run exact direct Rust runtime and provenance checks
        shell: bash
        run: |
          set -euo pipefail
          pair="$RUNNER_TEMP/adam-assist-direct-rust-pair"
          export ADAM_CORE_RS_ASSIST_PLANETS_PATH="$(python -c \
            'from naif_de440 import de440; print(de440)')"
          export ADAM_CORE_RS_ASSIST_ASTEROIDS_PATH="$(python -c \
            'from jpl_small_bodies_de441_n16 import de441_n16; print(de441_n16)')"
          test -f "$ADAM_CORE_RS_ASSIST_PLANETS_PATH"
          test -f "$ADAM_CORE_RS_ASSIST_ASTEROIDS_PATH"
          (
            cd "$pair"
            cargo test --locked --all-targets -- --ignored
          )
      - name: Run CPython 3.14 capsule and full-suite checks
        run: |
          python -m compileall -q src tests migration
          python -m pytest --benchmark-skip -q tests
      - name: Verify CPython 3.14 tracked state
        run: |
          pdm lock --check
          python migration/scripts/verify_registry_locks.py \
            --core-version "$ADAM_CORE_VERSION" --python-lock --rust-lock
          git diff --exit-code
          git -C .python314-pair/adam-core diff --exit-code
      - name: Upload exact CPython 3.14 source-built non-release pair evidence
        uses: actions/upload-artifact@v4
        with:
          name: python314-source-built-nonrelease-pair-wheels
          path: ${{ runner.temp }}/python314-source-built-pair-wheels/*.whl

  rust-quality:
    name: Public Core registry-locked Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adam-assist
        uses: actions/checkout@v4
      - name: Checkout exact public adam-core release
        uses: actions/checkout@v4
        with:
          repository: B612-Asteroid-Institute/adam_core
          ref: ${{ env.ADAM_CORE_SOURCE_REF }}
          path: .source-pair/adam-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - name: Verify source pair and run Rust gates
        shell: bash
        run: |
          set -euo pipefail
          python migration/scripts/verify_source_pair_contract.py \
            --core-tree .source-pair/adam-core
          manifest=rust/adam_assist_rs/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo check --manifest-path "$manifest" --locked --all-targets
          cargo check --manifest-path "$manifest" --locked --all-targets \
            --no-default-features
          cargo check --manifest-path "$manifest" --locked --all-targets \
            --all-features
          cargo clippy --manifest-path "$manifest" --locked --all-targets \
            -- -D warnings
          cargo clippy --manifest-path "$manifest" --locked --all-targets \
            --no-default-features -- -D warnings
          cargo clippy --manifest-path "$manifest" --locked --all-targets \
            --all-features -- -D warnings
          cargo test --manifest-path "$manifest" --locked --all-targets
          cargo test --manifest-path "$manifest" --locked --all-targets \
            --no-default-features
          cargo test --manifest-path "$manifest" --locked --all-targets \
            --all-features
          cargo test --manifest-path "$manifest" --locked --doc
          cargo test --manifest-path "$manifest" --locked --doc \
            --no-default-features
          cargo test --manifest-path "$manifest" --locked --doc \
            --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path "$manifest" \
            --locked --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path "$manifest" \
            --locked --no-deps --no-default-features
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path "$manifest" \
            --locked --no-deps --all-features
          git diff --exit-code
          git -C .source-pair/adam-core diff --exit-code

  benchmark:
    runs-on: ubuntu-latest
    needs: [source-pair, python-314-source-pair, rust-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: source-pair-wheels-3.12
          path: source-pair-wheels
      - name: Install the already-tested source-pair wheels
        run: |
          python -m pip install --upgrade pip
          core_wheel="$(find source-pair-wheels -name 'adam_core-*.whl' -print -quit)"
          assist_wheel="$(find source-pair-wheels -name 'adam_assist-*.whl' -print -quit)"
          test -n "$core_wheel" && test -n "$assist_wheel"
          python -m pip install "$core_wheel" "${assist_wheel}[dev]"
          python migration/scripts/verify_dev_environment.py --require-wheel
      - name: Run benchmarks
        run: python -m pytest --benchmark-only --benchmark-json bench.json tests
      - name: Run current public/native benchmark smoke
        run: python -m migration.scripts.benchmark_current --lanes tiny small large --repeats 5 --warmups 1 --require-native --output migration/artifacts/benchmark_current_assist_ci.json --markdown migration/artifacts/benchmark_current_assist_ci.md
      - name: Upload current-only benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assist-current-benchmark
          path: |
            migration/artifacts/benchmark_current_assist_ci.json
            migration/artifacts/benchmark_current_assist_ci.md
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-json
          path: bench.json
