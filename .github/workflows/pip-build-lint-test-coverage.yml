name: CI

on:
  push:
    branches: [ main, "v*" ]
  pull_request:
    branches: [ main, "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ADAM_CORE_VERSION: "0.8.0"
  ADAM_CORE_RELEASE_COMMIT: "37fcd1c6f5d38d70335e56c3b095658a466d1f50"

jobs:
  released-core:
    name: Core ${{ matrix.core-kind }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        core-kind: [released-registry]
    steps:
      - name: Checkout adam-assist
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - name: Verify exact released-Core pair contract
        shell: bash
        run: |
          set -euo pipefail
          test "${{ matrix.core-kind }}" = released-registry
          python migration/scripts/verify_source_pair_contract.py
      - name: Install build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.7,<2"
      - name: Build Assist and install released Core wheel pair
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/released-core-wheels"
          mkdir -p "$wheelhouse"
          maturin build --release --locked --out "$wheelhouse"
          assist_wheel="$(find "$wheelhouse" -name 'adam_assist-*.whl' -print -quit)"
          test -n "$assist_wheel"
          test "$(find "$wheelhouse" -name 'adam_assist-*.whl' | wc -l | tr -d ' ')" = 1
          python -m pip install --only-binary=:all: \
            "adam-core==$ADAM_CORE_VERSION" "${assist_wheel}[dev]"
          python -m pip check
          python migration/scripts/verify_dev_environment.py --require-wheel
      - name: Verify released Core identity and wheel dependency range
        run: |
          python - <<'PY'
          from importlib import metadata
          from pathlib import Path

          import adam_assist._native as assist_native
          from adam_core import _rust_native as core_native
          from packaging.requirements import Requirement

          assert metadata.version("adam-core") == "0.8.0"
          assert metadata.version("adam-assist") == "0.6.0"
          assert core_native.build_identity() == (
              "0.8.0",
              "37fcd1c6f5d38d70335e56c3b095658a466d1f50",
          )
          assert Path(core_native.__file__).resolve() != Path(assist_native.__file__).resolve()
          requirements = {
              Requirement(value).name: Requirement(value)
              for value in metadata.requires("adam-assist") or []
          }
          core = requirements["adam-core"]
          assert str(core.specifier) == "<0.9.0,>=0.8.0"
          assert "0.8.0" in core.specifier
          assert "0.9.0" not in core.specifier
          PY
      - name: Run released-pair capsule contracts
        run: |
          python -m pytest --benchmark-skip -q \
            tests/rust/test_adam_assist_rust_capsule.py \
            -k 'native_backend_is_capsule_only or capsule_propagation_preserves_order_nongrav_and_row_failures or capsule_stm_honors_custom_and_inactive_nongrav or capsule_owns_provider_lifetime'
      - name: Verify release-ready workflow policy
        run: python migration/scripts/verify_workflow_policy.py
      - name: Run non-live wheel tests
        if: matrix.python-version != '3.12'
        run: |
          python -m compileall -q src tests migration
          python -m pytest --benchmark-skip -q tests
      - name: Run non-live wheel tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          python -m compileall -q src tests migration
          python -m pytest --benchmark-skip --cov=adam_assist --cov-report=xml -q tests
      - name: Lint and typecheck the source
        if: matrix.python-version == '3.12'
        run: |
          ruff check src/adam_assist tests
          black --check src/adam_assist tests
          isort --check-only src/adam_assist tests
          mypy --strict src/adam_assist
      - name: Verify authentic registry locks and clean tracked state
        run: |
          pdm lock --check
          python migration/scripts/verify_registry_locks.py \
            --core-version "$ADAM_CORE_VERSION" --python-lock --rust-lock
          git diff --exit-code
      - name: Upload released-Core Assist wheel
        uses: actions/upload-artifact@v4
        with:
          name: released-core-wheels-${{ matrix.python-version }}
          path: ${{ runner.temp }}/released-core-wheels/*.whl
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Coverage report to coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2.0.0
        with:
          path-to-lcov: coverage.xml

  rust-quality:
    name: Core released-registry Rust/runtime quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adam-assist
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - name: Install released Core runtime and kernels
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: \
            "adam-core==$ADAM_CORE_VERSION" \
            "jpl-small-bodies-de441-n16==2021.3.31.1"
          python -m pip check
      - name: Verify released registry pair and run Rust gates
        shell: bash
        run: |
          set -euo pipefail
          python migration/scripts/verify_source_pair_contract.py
          python migration/scripts/verify_registry_locks.py \
            --core-version "$ADAM_CORE_VERSION" --rust-lock
          manifest=rust/adam_assist_rs/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo check --manifest-path "$manifest" --locked --all-targets
          cargo check --manifest-path "$manifest" --locked --all-targets \
            --no-default-features
          cargo check --manifest-path "$manifest" --locked --all-targets \
            --all-features
          cargo clippy --manifest-path "$manifest" --locked --all-targets \
            -- -D warnings
          cargo clippy --manifest-path "$manifest" --locked --all-targets \
            --no-default-features -- -D warnings
          cargo clippy --manifest-path "$manifest" --locked --all-targets \
            --all-features -- -D warnings
          cargo test --manifest-path "$manifest" --locked --all-targets
          cargo test --manifest-path "$manifest" --locked --all-targets \
            --no-default-features
          cargo test --manifest-path "$manifest" --locked --all-targets \
            --all-features
          cargo test --manifest-path "$manifest" --locked --doc
          cargo test --manifest-path "$manifest" --locked --doc \
            --no-default-features
          cargo test --manifest-path "$manifest" --locked --doc \
            --all-features
          cargo run --manifest-path "$manifest" --locked --example core_owned_od
          cargo metadata --manifest-path "$manifest" --locked \
            --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python migration/scripts/verify_rust_core_line.py \
            --metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --core-version "$ADAM_CORE_VERSION"
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path "$manifest" \
            --locked --no-deps
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path "$manifest" \
            --locked --no-deps --no-default-features
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path "$manifest" \
            --locked --no-deps --all-features
      - name: Run direct Rust runtime and provenance contracts
        shell: bash
        run: |
          set -euo pipefail
          export ADAM_CORE_RS_ASSIST_PLANETS_PATH="$(python -c \
            'from naif_de440 import de440; print(de440)')"
          export ADAM_CORE_RS_ASSIST_ASTEROIDS_PATH="$(python -c \
            'from jpl_small_bodies_de441_n16 import de441_n16; print(de441_n16)')"
          test -f "$ADAM_CORE_RS_ASSIST_PLANETS_PATH"
          test -f "$ADAM_CORE_RS_ASSIST_ASTEROIDS_PATH"
          cargo test --manifest-path rust/adam_assist_rs/Cargo.toml \
            --locked --all-targets -- --ignored
          git diff --exit-code

  benchmark:
    runs-on: ubuntu-latest
    needs: [released-core, rust-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: released-core-wheels-3.12
          path: released-core-wheels
      - name: Install the already-tested released-Core wheel pair
        run: |
          python -m pip install --upgrade pip
          assist_wheel="$(find released-core-wheels -name 'adam_assist-*.whl' -print -quit)"
          test -n "$assist_wheel"
          python -m pip install --only-binary=:all: \
            "adam-core==$ADAM_CORE_VERSION" "${assist_wheel}[dev]"
          python -m pip check
          python migration/scripts/verify_dev_environment.py --require-wheel
      - name: Run benchmarks
        run: python -m pytest --benchmark-only --benchmark-json bench.json tests
      - name: Run current public/native benchmark smoke
        run: python -m migration.scripts.benchmark_current --lanes tiny small large --repeats 5 --warmups 1 --require-native --output migration/artifacts/benchmark_current_assist_ci.json --markdown migration/artifacts/benchmark_current_assist_ci.md
      - name: Upload current-only benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assist-current-benchmark
          path: |
            migration/artifacts/benchmark_current_assist_ci.json
            migration/artifacts/benchmark_current_assist_ci.md
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-json
          path: bench.json
