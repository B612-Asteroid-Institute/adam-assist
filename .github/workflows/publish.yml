name: Publish tested adam-assist preview wheels

on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful Release candidate wheel matrix run ID for this exact commit
        required: true
        type: string
      release_sha:
        description: Exact commit referenced by the immutable release tag
        required: true
        type: string
      expected_version:
        description: Exact adam-assist PEP 440 release-candidate version
        required: true
        default: 0.4.0rc6
        type: string
      expected_adam_core_version:
        description: Exact already-published adam-core release candidate
        required: true
        default: 0.5.6rc5
        type: string
      expected_rust_crate_sha256:
        description: Exact published adam_assist crate checksum
        required: true
        type: string
      recovery_from_main:
        description: Permit a default-branch dispatch that still checks out the immutable release tag
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type "publish adam-assist <version> from <sha> to pypi"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  collect-tested-artifacts:
    name: Collect and verify already-tested preview wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.expected_version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install wheel filename parser
        run: |
          python -m pip install --only-binary=:all: packaging
      - name: Verify immutable release tag and irreversible-action confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SHA: ${{ inputs.release_sha }}
          RECOVERY_FROM_MAIN: ${{ inputs.recovery_from_main }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            "refs/tags/v$EXPECTED_VERSION") test "$RECOVERY_FROM_MAIN" = "false" ;;
            refs/heads/main) test "$RECOVERY_FROM_MAIN" = "true" ;;
            *) echo "publication must run from the release tag or an explicit main recovery" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$CONFIRMATION" = "publish adam-assist $EXPECTED_VERSION from $EXPECTED_SHA to pypi"
      - name: Verify source prerelease and exact adam-core dependency
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_CORE_VERSION: ${{ inputs.expected_adam_core_version }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          from packaging.version import Version

          assist = Version(os.environ["EXPECTED_VERSION"])
          core = Version(os.environ["EXPECTED_CORE_VERSION"])
          if assist.pre is None or assist.pre[0] != "rc" or core.pre is None or core.pre[0] != "rc":
              raise SystemExit(f"only release candidates are accepted: {assist=} {core=}")
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          expected = f"adam-core=={core}"
          if expected not in pyproject["project"]["dependencies"]:
              raise SystemExit(f"missing exact preview dependency {expected}")
          cargo = tomllib.loads(Path("rust/adam_assist_rs/Cargo.toml").read_text())
          package = cargo["package"]
          cargo_version = package["version"]
          if cargo_version != "0.4.0-rc.6" or str(assist) != "0.4.0rc6":
              raise SystemExit(f"source version mismatch: {cargo_version=} {assist=}")
          if package["name"] != "adam_assist" or package["rust-version"] != "1.87":
              raise SystemExit(f"unexpected public Rust package metadata: {package}")
          if package.get("publish", True) is not True:
              raise SystemExit("adam_assist Rust crate is not publishable")
          for name in ("adam_core_rs_coords", "adam_core_rs_spice"):
              if cargo["dependencies"].get(name) != "=0.1.0-rc.4":
                  raise SystemExit(f"{name} is not exact-pinned to public 0.1.0-rc.4")
          kernel_data = cargo["dependencies"].get("adam_core_rs_kernel_data")
          expected_kernel_data = {
              "version": "=0.1.0-rc.4",
              "default-features": False,
              "optional": True,
          }
          if kernel_data != expected_kernel_data:
              raise SystemExit("adam_core_rs_kernel_data is not exact-pinned")
          if Path("rust/vendor").exists():
              raise SystemExit("temporary vendored core crates must be absent")
          PY
      - name: Require the matching public Rust crate
        env:
          EXPECTED_CHECKSUM: ${{ inputs.expected_rust_crate_sha256 }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://index.crates.io/ad/am/adam_assist",
              headers={
                  "User-Agent": (
                      "adam-assist-release-check/0.4.0rc6 "
                      "(+https://github.com/B612-Asteroid-Institute/adam-assist)"
                  )
              },
          )
          with urllib.request.urlopen(request) as response:
              entries = [json.loads(line) for line in response if line.strip()]
          matches = [entry for entry in entries if entry["vers"] == "0.4.0-rc.6"]
          if len(matches) != 1:
              raise SystemExit(f"expected one public Rust crate entry, found {len(matches)}")
          entry = matches[0]
          if entry["yanked"]:
              raise SystemExit("adam_assist 0.4.0-rc.6 is yanked")
          if entry["cksum"] != os.environ["EXPECTED_CHECKSUM"]:
              raise SystemExit(f"unexpected adam_assist checksum: {entry['cksum']}")
          if entry.get("rust_version") != "1.87":
              raise SystemExit(f"unexpected adam_assist MSRV: {entry.get('rust_version')}")
          PY
      - name: Verify acceptance provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.acceptance_run_id }}
          EXPECTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(jq -r .conclusion <<<"$RUN_JSON")" = success
          test "$(jq -r .head_sha <<<"$RUN_JSON")" = "$EXPECTED_SHA"
          test "$(jq -r .name <<<"$RUN_JSON")" = "Release candidate wheel matrix"
          case "$(jq -r .event <<<"$RUN_JSON")" in
            push|workflow_dispatch) ;;
            *) echo "acceptance must be built from an exact push or workflow-dispatch checkout" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ github.token }}
          pattern: wheel-acceptance-*
          path: acceptance-artifacts
      - name: Aggregate and verify adam-assist wheels without rebuilding
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_CORE_VERSION: ${{ inputs.expected_adam_core_version }}
        run: |
          set -euo pipefail
          mkdir dist
          find acceptance-artifacts -type f -name 'adam_assist-*.whl' -exec cp '{}' dist/ ';'
          test "$(find dist -maxdepth 1 -name 'adam_assist-*.whl' | wc -l | tr -d ' ')" = 12
          python - <<'PY'
          import email
          import os
          import zipfile
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name, parse_wheel_filename
          from packaging.version import Version

          expected_version = Version(os.environ["EXPECTED_VERSION"])
          expected_core = Version(os.environ["EXPECTED_CORE_VERSION"])
          expected_requirements = {
              "adam-core": f"=={expected_core}",
              "naif-de440": "==2020.12.21.1",
              "jpl-small-bodies-de441-n16": "==2021.3.31.1",
          }
          expected_python = {"cp311", "cp312", "cp313"}
          expected_platforms = {
              "manylinux_2_17_x86_64",
              "manylinux_2_17_aarch64",
              "macosx_11_0_arm64",
              "macosx_10_12_x86_64",
          }
          allowed_platform_aliases = {
              "manylinux2014_x86_64",
              "manylinux2014_aarch64",
          }
          combinations = set()
          for wheel in sorted(Path("dist").glob("*.whl")):
              name, version, _, tags = parse_wheel_filename(wheel.name)
              if canonicalize_name(name) != "adam-assist" or version != expected_version:
                  raise SystemExit(f"unexpected wheel identity: {wheel.name}")
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  metadata_paths = [n for n in names if n.endswith(".dist-info/METADATA")]
                  if len(metadata_paths) != 1:
                      raise SystemExit(f"{wheel.name}: unexpected METADATA files")
                  metadata = email.message_from_bytes(archive.read(metadata_paths[0]))
                  if "adam_assist/version.py" not in names:
                      raise SystemExit(f"{wheel.name}: missing adam_assist/version.py")
                  namespace = {}
                  exec(archive.read("adam_assist/version.py"), namespace)
                  if namespace.get("__version__") != str(expected_version):
                      raise SystemExit(f"{wheel.name}: bad runtime version")
                  if not any(
                      name.startswith("adam_assist/_native")
                      and name.endswith((".so", ".pyd", ".dylib"))
                      for name in names
                  ):
                      raise SystemExit(f"{wheel.name}: missing native extension")
                  packaged_tests = [
                      name
                      for name in names
                      if name.startswith("adam_assist/")
                      and ("/tests/" in name or Path(name).name.startswith("test_"))
                  ]
                  if packaged_tests:
                      raise SystemExit(f"{wheel.name}: packaged tests {packaged_tests[:1]}")
              requirements = [Requirement(value) for value in metadata.get_all("Requires-Dist", [])]
              unconditional_requirements = {
                  canonicalize_name(requirement.name): str(requirement.specifier)
                  for requirement in requirements
                  if requirement.marker is None
              }
              if unconditional_requirements != expected_requirements:
                  raise SystemExit(
                      f"{wheel.name}: bad release dependencies "
                      f"{unconditional_requirements}"
                  )
              interpreters = {tag.interpreter for tag in tags}
              abis = {tag.abi for tag in tags}
              platforms = {tag.platform for tag in tags}
              if len(interpreters) != 1 or abis != interpreters:
                  raise SystemExit(
                      f"{wheel.name}: unexpected interpreter/ABI tags {sorted(map(str, tags))}"
                  )
              canonical_platforms = platforms & expected_platforms
              if len(canonical_platforms) != 1:
                  raise SystemExit(
                      f"{wheel.name}: expected one canonical platform tag, got {sorted(platforms)}"
                  )
              if not platforms <= expected_platforms | allowed_platform_aliases:
                  raise SystemExit(
                      f"{wheel.name}: unexpected platform aliases {sorted(platforms)}"
                  )
              combinations.add((interpreters.pop(), canonical_platforms.pop()))
          expected = {(python, platform) for python in expected_python for platform in expected_platforms}
          if combinations != expected:
              raise SystemExit(
                  f"wheel matrix mismatch: missing={sorted(expected - combinations)} "
                  f"extra={sorted(combinations - expected)}"
              )
          PY
          sha256sum dist/*.whl | sort | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: adam-assist-${{ inputs.expected_version }}-tested-publication-set
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: collect-tested-artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi-preview
      url: https://pypi.org/p/adam-assist
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adam-assist-${{ inputs.expected_version }}-tested-publication-set
          path: dist
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
